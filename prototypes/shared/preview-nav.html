<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nav preview</title>
  <style>
    html, body { margin: 0; background: #fff; }
    .frame {
      position: relative;
      width: 1536px;
      height: 1024px;
      overflow: hidden;
      background: #f5f7fa;
    }
    .header {
      position: absolute;
      left: 0; top: 0;
      width: 1536px; height: 64px;
      overflow: hidden;
      z-index: 3;
    }
    .header img {
      position: absolute;
      left: 0; top: 0;
      width: 1536px; height: 1024px;
    }
    .body {
      position: absolute;
      left: 0; top: 64px;
      width: 1536px;
      height: 960px;
      display: flex;
      z-index: 2;
    }
    .rail {
      width: 72px;
      height: 960px;
      background: #f8fafc;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0 20px;
      gap: 6px;
      box-sizing: border-box;
      flex: 0 0 72px;
    }
    .icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: grid; place-items: center; color: #374151;
    }
    .icon.active { background: #2f6fed; color: #fff; }
    .icon.settings { background: #e8ecff; }
    .icon svg { width: 22px; height: 22px; display: block; }
    .divider { width: 28px; height: 1px; background: #d1d5db; margin: 8px 0; }
    .spacer { flex: 1; }
    .main {
      position: relative;
      flex: 1;
      height: 960px;
      overflow: hidden;
      background: #f5f7fa;
    }
    .main img {
      position: absolute;
      /* shift left to hide old sidebar (~210px), keep header already sliced */
      left: -210px;
      top: -64px;
      width: 1536px;
      height: 1024px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="header">
      <img src="../images/req1-school-dashboard.png" alt="" />
    </div>
    <div class="body">
      <div class="rail">
        <div class="icon active"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h16a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7l-5 4v-4H4a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="#f8fafc"/><circle cx="12" cy="12" r="2"/><rect x="11" y="1" width="2" height="4" rx="1"/><rect x="11" y="19" width="2" height="4" rx="1"/><rect x="1" y="11" width="4" height="2" rx="1"/><rect x="19" y="11" width="4" height="2" rx="1"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="3" width="6" height="18" rx="1.5"/><rect x="9" y="3" width="6" height="18" rx="1.5"/><path d="M17 4.2 21.5 6v13.5L17 17.7V4.2z"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.4l3.2 1.9-.9 1.5L11 14.2V7h1z" fill="#f8fafc"/></svg></div>
        <div class="divider"></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="2" width="8" height="8" rx="1.5"/><rect x="14" y="2" width="8" height="8" rx="1.5"/><rect x="2" y="14" width="8" height="8" rx="1.5"/><path d="m14 16 4 4 4-4-4-4-4 4z"/></svg></div>
        <div class="divider"></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.5"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7v1H4v-1z"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/><path d="m15.8 8.2-2 5.2-5.2 2 2-5.2 5.2-2z" fill="#f8fafc"/><circle cx="12" cy="12" r="1.6"/></svg></div>
        <div class="spacer"></div>
        <div class="icon settings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm8.1 2.9-1.7-1 .3-1.9-1.6-1.6-1.9.3-1-1.7h-2.4l-1 1.7-1.9-.3-1.6 1.6.3 1.9-1.7 1v2.4l1.7 1-.3 1.9 1.6 1.6 1.9-.3 1 1.7h2.4l1-1.7 1.9.3 1.6-1.6-.3-1.9 1.7-1v-2.4zM12 15.2A3.2 3.2 0 1 0 12 8.8a3.2 3.2 0 0 0 0 6.4z"/></svg></div>
      </div>
      <div class="main">
        <img src="../images/req1-school-dashboard.png" alt="" />
      </div>
    </div>
  </div>
</body>
</html>
