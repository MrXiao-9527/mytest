<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nav preview</title>
  <style>
    html, body { margin: 0; background: #fff; }
    .frame {
      position: relative;
      width: 1536px;
      height: 1024px;
      overflow: hidden;
      background: #f5f7fa;
    }
    .header {
      position: absolute;
      left: 0; top: 0;
      width: 1536px; height: 64px;
      overflow: hidden;
      z-index: 3;
    }
    .header img {
      position: absolute;
      left: 0; top: 0;
      width: 1536px; height: 1024px;
    }
    .body {
      position: absolute;
      left: 0; top: 64px;
      width: 1536px;
      height: 960px;
      display: flex;
      z-index: 2;
    }
    .rail {
      width: 72px;
      height: 960px;
      background: #f8fafc;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0 20px;
      gap: 6px;
      box-sizing: border-box;
      flex: 0 0 72px;
    }
    .icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: grid; place-items: center; color: #374151;
    }
    .icon.active { background: #2f6fed; color: #fff; }
    .icon.settings { background: #e8ecff; }
    .icon svg { width: 22px; height: 22px; display: block; }
    .divider { width: 28px; height: 1px; background: #d1d5db; margin: 8px 0; }
    .spacer { flex: 1; }
    .main {
      position: relative;
      flex: 1;
      height: 960px;
      overflow: hidden;
      background: #f5f7fa;
    }
    .main img {
      position: absolute;
      /* shift left to hide old sidebar (~210px), keep header already sliced */
      left: -210px;
      top: -64px;
      width: 1536px;
      height: 1024px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="header">
      <img src="../images/req1-school-dashboard.png" alt="" />
    </div>
    <div class="body">
      <div class="rail">
        <div class="icon active"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 .001 20.001A10 10 0 0 0 12 2zm0 3a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm-1-7h2v3h-2V1zm0 18h2v3h-2v-3zM1 11h3v2H1v-2zm19 0h3v2h-3v-2z"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h5a2 2 0 0 1 2 2v14H5a2 2 0 0 1-2-2V4zm8 0h5a2 2 0 0 1 2 2v14h-7V4zm8.2.6 2.6 1.2v13.3l-2.6-1.2V4.6z"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 10 10h-2A8 8 0 1 1 12 4V2zm1 5v5.2l3.4 2-1 1.6L11 13V7h2z"/></svg></div>
        <div class="divider"></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm13 1 5 5-5 5-5-5 5-5z"/></svg></div>
        <div class="divider"></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm3.7 6.3-2.2 5.5-5.5 2.2 2.2-5.5 5.5-2.2z"/></svg></div>
        <div class="spacer"></div>
        <div class="icon settings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.39-1.04-.71-1.62-.94l-.36-2.54A.48.48 0 0 0 12.9 2h-3.8a.48.48 0 0 0-.48.41l-.36 2.54c-.58.23-1.12.55-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L1.74 8.47a.49.49 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L1.86 14.5a.49.49 0 0 0-.12.61l1.92 3.32c.13.23.4.32.64.22l2.39-.96c.5.39 1.04.71 1.62.94l.36 2.54c.05.24.25.41.48.41h3.8c.24 0 .44-.17.48-.41l.36-2.54c.58-.23 1.12-.55 1.62-.94l2.39.96c.24.1.51 0 .64-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM11 15.5A3.5 3.5 0 1 1 14.5 12 3.5 3.5 0 0 1 11 15.5z"/></svg></div>
      </div>
      <div class="main">
        <img src="../images/req1-school-dashboard.png" alt="" />
      </div>
    </div>
  </div>
</body>
</html>
