<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CNKI AI · Link Institution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body data-active="qa">
  <div class="app" id="app"></div>
  <div id="page" hidden>
    <div class="modal-backdrop">
      <div class="panel modal">
        <div class="chip" style="margin-bottom:12px;">Off Campus</div>
        <h1 class="h2">Link Your Institution</h1>
        <p class="sub">On campus, access binds by IP. Off campus, link once to unlock school benefits.</p>
        <div style="margin:18px 0;padding:14px;border:1px solid var(--line);border-radius:10px;font-size:14px;">
          <div class="muted" style="font-size:12px;margin-bottom:6px;">Signed in as</div>
          <div style="font-weight:600;">alex.chen@example.com</div>
          <div class="muted" style="margin-top:12px;font-size:12px;">Institution</div>
          <div style="margin-top:6px;font-weight:600;color:var(--blue);">CNKI University</div>
        </div>
        <button class="btn" style="width:100%;">Link Institution Account</button>
        <p class="sub" style="margin-top:12px;font-size:12px;">Unlocks CNKI University campus sources and dashboard.</p>
      </div>
    </div>
  </div>
  <script src="../js/shell.js"></script>
</body>
</html>
