<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chrome overlay preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; }
    .stage {
      position: relative;
      width: 1536px;
      height: 1024px;
      overflow: hidden;
      background: #fff;
    }
    .stage > img.base {
      width: 1536px;
      height: 1024px;
      display: block;
    }
    /* Cover original left chrome with our exact logo + icon rail */
    .rail {
      position: absolute;
      left: 0; top: 0;
      width: 72px;
      height: 1024px;
      background: #f7f8fa;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 70px 0 18px;
      z-index: 3;
    }
    .logo {
      width: 34px;
      height: 34px;
      object-fit: contain;
      margin-bottom: 18px;
      display: block;
    }
    .ico {
      width: 40px; height: 40px; border-radius: 10px;
      display: grid; place-items: center;
      color: #64748b;
      margin: 1px 0;
    }
    .ico.active { background: #e8f1ff; color: #2f6fed; }
    .ico svg, .settings svg {
      width: 20px; height: 20px;
      stroke: currentColor; fill: none; stroke-width: 1.7;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .divider { width: 28px; height: 1px; background: #e5e7eb; margin: 8px 0; }
    .settings {
      margin-top: auto;
      width: 40px; height: 40px; border-radius: 10px;
      background: #eef0ff; color: #64748b;
      display: grid; place-items: center;
    }
    /* Cover old header-left text logo if any */
    .header-mask {
      position: absolute;
      left: 72px; top: 0;
      width: 220px; height: 56px;
      background: #fff;
      z-index: 2;
    }
    .header-right {
      position: absolute;
      right: 0; top: 0;
      height: 56px; width: 280px;
      background: #fff;
      display: flex; align-items: center; justify-content: flex-end;
      gap: 16px; padding-right: 28px;
      z-index: 2;
      font: 500 14px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
      color: #4b5563;
    }
    .header-right .sep { width: 1px; height: 14px; background: #d1d5db; }
    .header-right svg { width: 18px; height: 18px; stroke: #4b5563; fill: none; stroke-width: 1.7; }
  </style>
</head>
<body>
  <div class="stage">
    <img class="base" src="../images/req1-school-dashboard.png" alt="base" />
    <div class="header-mask"></div>
    <div class="header-right">
      <span>Guide</span>
      <span class="sep"></span>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/></svg>
      <span class="sep"></span>
      <span>Account</span>
    </div>
    <aside class="rail">
      <img class="logo" src="../shared/logo-robot.png" alt="logo" />
      <div class="ico active"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8"/><path d="M8 13h5"/></svg></div>
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M4 12h16"/><circle cx="12" cy="12" r="3"/></svg></div>
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 5h5a3 3 0 0 1 3 0h8v12h-8a3 3 0 0 0-3 0H4"/><path d="M12 5v12"/></svg></div>
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg></div>
      <div class="divider"></div>
      <div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><path d="M17.5 3.5 21 7l-3.5 3.5L14 7z"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
      <div class="divider"></div>
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg></div>
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 14 5-2 2-5-5 2z"/></svg></div>
      <div class="settings"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></div>
    </aside>
  </div>
</body>
</html>
