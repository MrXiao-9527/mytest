<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CNKI AI · Source Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/chrome.css" />
  <style>
    .screen {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 72px 24px 40px;
      background: #ffffff;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 34px;
      color: var(--blue);
      letter-spacing: -0.02em;
    }
    .composer {
      width: min(760px, 100%);
      background: #fff;
      border: 1px solid #d7e2ef;
      border-radius: 18px;
      padding: 16px 16px 12px;
      box-shadow: 0 10px 28px rgba(30,60,110,.06);
    }
    .composer textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      min-height: 64px;
      font: inherit;
      font-size: 15px;
    }
    .composer-bar {
      display: flex;
      justify-content: flex-end;
    }
    .send {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--blue); color: #fff; display: grid; place-items: center;
    }
    .panel {
      width: min(760px, 100%);
      margin-top: 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px 18px;
    }
    .tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
    .tabs span {
      padding: 0 0 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }
    .tabs .on {
      color: var(--blue);
      border-bottom: 2px solid var(--blue);
    }
    .checks label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      font-size: 14px;
    }
    .hint {
      margin-top: 8px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 500;
    }
    .compare {
      margin-top: 16px;
      background: #f3f7ff;
      border-radius: 12px;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      font-size: 13px;
    }
    .compare .vs {
      width: 34px; height: 34px; border-radius: 50%;
      background: #fff; color: var(--blue); display: grid; place-items: center;
      font-weight: 700; border: 1px solid #d7e2ef;
    }
    .foot {
      width: min(760px, 100%);
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body data-active="qa">
  <div id="screen" class="screen" hidden>
    <h1>Ask a research question</h1>
    <div class="composer">
      <textarea placeholder="Ask a research question" readonly></textarea>
      <div class="composer-bar"><div class="send">➤</div></div>
    </div>
    <div class="panel">
      <div class="tabs">
        <span>Open Knowledge</span>
        <span class="on">My Library</span>
      </div>
      <div class="checks">
        <label><input type="checkbox" checked disabled /> Institutional Repository (IR)</label>
        <label><input type="checkbox" checked disabled /> Special Collections</label>
        <label><input type="checkbox" disabled /> Department Corpus</label>
      </div>
      <div class="hint">Answers stay within your selected campus sources.</div>
      <div class="compare">
        <div><b>Open knowledge</b><br/>Broad journals, books, and web sources.</div>
        <div class="vs">VS</div>
        <div><b>Campus sources</b><br/>CNKI University IR and curated collections.</div>
      </div>
    </div>
    <div class="foot">Choose the source that best fits your research needs at CNKI University.</div>
  </div>
  <script src="../shared/chrome.js"></script>
</body>
</html>
